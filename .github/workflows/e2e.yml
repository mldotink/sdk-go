name: E2E
run-name: E2E ${{ inputs.test_regex }}

on:
  workflow_dispatch:
    inputs:
      test_regex:
        description: Go test -run regex.
        required: true
        default: .
      workspace:
        description: Ink workspace. Empty uses INK_WORKSPACE secret or e2e.
        required: false
        default: ""
      project:
        description: Ink project. Empty uses INK_PROJECT secret or default.
        required: false
        default: ""
      timeout:
        description: Go test timeout.
        required: true
        default: 12m
      sdk_ref:
        description: SDK ref to test. Empty uses the selected branch.
        required: false
        default: ""
  workflow_call:
    inputs:
      test_regex:
        type: string
        required: false
        default: .
      workspace:
        type: string
        required: false
        default: ""
      project:
        type: string
        required: false
        default: ""
      timeout:
        type: string
        required: false
        default: 12m
      sdk_ref:
        type: string
        required: false
        default: main
    secrets:
      INK_API_KEY:
        required: true
      INK_API_URL:
        required: false
      INK_WORKSPACE:
        required: false
      INK_PROJECT:
        required: false

permissions:
  contents: read

jobs:
  e2e:
    name: Run E2E
    runs-on: [self-hosted, ink]
    timeout-minutes: 30
    env:
      INK_API_KEY: ${{ secrets.INK_API_KEY }}
      INK_API_URL: ${{ secrets.INK_API_URL }}
      INK_WORKSPACE: ${{ inputs.workspace != '' && inputs.workspace || secrets.INK_WORKSPACE || 'e2e' }}
      INK_PROJECT: ${{ inputs.project != '' && inputs.project || secrets.INK_PROJECT || 'default' }}
      E2E_RUN: ${{ inputs.test_regex }}
      E2E_TIMEOUT: ${{ inputs.timeout }}

    steps:
      - name: Resolve SDK ref
        id: sdk-ref
        run: |
          if [ -n "${{ inputs.sdk_ref }}" ]; then
            echo "ref=${{ inputs.sdk_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.repository }}" = "mldotink/sdk-go" ]; then
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: mldotink/sdk-go
          ref: ${{ steps.sdk-ref.outputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check configuration
        run: |
          test -n "$INK_API_KEY"
          test -n "$INK_WORKSPACE"
          test -n "$INK_PROJECT"

      - name: Run e2e
        run: make e2e
