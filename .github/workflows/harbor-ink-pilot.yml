name: Harbor Ink pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proto-area-bulk-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      INK_API_KEY: ${{ secrets.INK_API_KEY }}
      INK_API_URL: ${{ secrets.INK_API_URL }}
      INK_WORKSPACE: ${{ secrets.INK_WORKSPACE || 'e2e' }}
      INK_PROJECT: ${{ secrets.INK_PROJECT || 'default' }}
      OPENAI_API_KEY: ${{ secrets.HARBOR_OPENAI_API_KEY }}

    steps:
      - name: Check configuration
        run: |
          test -n "$INK_API_KEY"
          test -n "$OPENAI_API_KEY"

      - name: Checkout Physicslab
        uses: actions/checkout@v4
        with:
          repository: gluonfield/physics-env-v2
          ref: main
          token: ${{ secrets.PHYSICS_ENV_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Prepare isolated pilot
        working-directory: harbor
        run: |
          cp -R tasks/2026-07-29-v1/proto-area-bulk-geometry /tmp/ink-pilot-task
          sed -i '/^\[agent\]$/,/^\[/s/^timeout_sec = 21600.0$/timeout_sec = 3300.0/' /tmp/ink-pilot-task/task.toml
          sed -i '/^\[verifier\]$/a environment_mode = "separate"' /tmp/ink-pilot-task/task.toml
          sed -i '/^\[environment\]$/i [verifier.environment]\ndocker_image = "ttl.sh/ink-harbor-proto-area-20260729@sha256:f0aa09657d97de7dae1e3fc9e77d92703d9931c6d64dd7a909445fab99b43bbe"\nnetwork_mode = "no-network"\nos = "linux"\ncpus = 3\nmemory_mb = 2048\nstorage_mb = 8192\n' /tmp/ink-pilot-task/task.toml
          sed -i '/^\[environment\]$/a docker_image = "ttl.sh/ink-harbor-proto-area-20260729@sha256:f0aa09657d97de7dae1e3fc9e77d92703d9931c6d64dd7a909445fab99b43bbe"' /tmp/ink-pilot-task/task.toml
          sed -i '/^\[environment\]$/,/^\[\[/s/^network_mode = "no-network"$/network_mode = "allowlist"\nallowed_hosts = ["api.openai.com", "chatgpt.com", "ab.chatgpt.com", "auth.openai.com", "api.anthropic.com", "generativelanguage.googleapis.com", "openrouter.ai", "x.ai", "cli-chat-proxy.grok.com", "auth.x.ai", "accounts.x.ai", "api.x.ai"]/' /tmp/ink-pilot-task/task.toml
          jq -n '{
            job_name: "physicslab-ink-proto-area-pilot",
            n_attempts: 1,
            n_concurrent_trials: 1,
            retry: {max_retries: 0},
            environment: {
              import_path: "physicslab.ink_environment:InkEnvironment",
              kwargs: {destroy_timeout_seconds: 7200}
            },
            verifier: {disable: true},
            agents: [{
              name: "codex",
              model_name: "gpt-5.6-sol",
              n_concurrent: 1,
              kwargs: {
                version: "0.146.0",
                reasoning_effort: "xhigh",
                web_search: "disabled"
              }
            }],
            tasks: [{path: "/tmp/ink-pilot-task", source: "2026-07-29-v1"}]
          }' >/tmp/ink-pilot.json

      - name: Run one problem on Ink
        working-directory: harbor
        run: |
          uv run python - <<'PY'
          import os

          from ink import Ink, NotFoundError, SandboxState

          client = Ink()
          try:
              sandbox = client.sandboxes.get(
                  "sbx_FH27HiT3QetqE8jQbnyq9U",
                  workspace=os.environ["INK_WORKSPACE"],
              )
              print(f"Cleaning previous pilot sandbox {sandbox.id} ({sandbox.state.value})")
              if sandbox.state not in {SandboxState.FAILED, SandboxState.TERMINATED}:
                  sandbox.terminate(wait=False)
          except NotFoundError:
              pass
          finally:
              client.close()
          PY
          uv run harbor run --config /tmp/ink-pilot.json --yes --debug

      - name: Upload result and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physicslab-ink-proto-area-pilot
          path: harbor/jobs/physicslab-ink-proto-area-pilot
          if-no-files-found: warn
          retention-days: 14
